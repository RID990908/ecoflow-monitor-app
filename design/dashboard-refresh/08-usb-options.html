<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USB-C options</title>
<style>
:root{--bg:#070b12;--text:#f4f7fb;--dim:#a3afbf;--r:#f87171}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:28px 18px;min-height:560px}
h1{font-size:17px;text-align:center;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 12px;max-width:420px;margin:auto}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px}
.node{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--r);background:rgba(248,113,113,.12);display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(248,113,113,.35)}
.node.idle{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.04);box-shadow:none}
.tag{font-size:12px;color:var(--dim)}.pair{display:flex;gap:8px}
</style></head><body>
